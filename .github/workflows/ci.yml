name: Check the website

# Every pull request, and every push to main: the HTML is valid and every
# internal link resolves. Pull requests from this repository also get a
# preview: a version of the site that is uploaded but not live, at its own
# workers.dev address, linked in a comment on the PR. Pull requests from forks
# get the checks only, so outside code never sees the Cloudflare token.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: HTML is valid
        run: npx --yes html-validate@11.17.0 "public/**/*.html"
      - name: Internal links resolve
        run: node scripts/check-links.mjs

  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Upload a preview (not live)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (README, Deployment)."
            exit 1
          fi
          out=$(npx --yes wrangler@4.151.3 versions upload --preview-alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(echo "$out" | grep -oE "https://pr-$PR_NUMBER-[a-z0-9.-]+\.workers\.dev" | tail -1)
          [ -n "$url" ] || url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::Wrangler gave no preview address. Is workers.dev on for tenwise-website (wrangler.jsonc)?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Link the preview on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          body="<!-- tenwise-preview -->**Preview:** $URL

          Not live: tenwise.app changes only when this is merged. The preview updates with each push."
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[] | select(.body | startswith("<!-- tenwise-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
