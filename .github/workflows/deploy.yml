name: Deploy the website to Cloudflare

# Every push to main publishes this folder as the tenwise-website Worker
# (wrangler.jsonc). Visitors reach it at tenwise.app through the platform's
# Worker, which shows the website to anyone who isn't signed in.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on the
# account) and CLOUDFLARE_ACCOUNT_ID; the PR previews (ci.yml) use them too.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: HTML is valid
        run: npx --yes html-validate@11.17.0 "public/**/*.html"
      - name: Internal links resolve
        run: node scripts/check-links.mjs
      # A missing token fails the run: skipping quietly would report a deploy
      # that never happened, and tenwise.app would keep the old site.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (README, Deployment). Nothing was deployed to tenwise.app."
            exit 1
          fi
          npx --yes wrangler@4.151.3 deploy
