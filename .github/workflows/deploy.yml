name: Deploy the website to Cloudflare

# Every push to main publishes this folder as the tenwise-website Worker
# (wrangler.jsonc), and every push to sandbox as tenwise-website-sandbox.
# Visitors reach them at tenwise.app and sandbox.tenwise.app through the
# platform's Workers, which show the website to anyone who isn't signed in.
# Needs CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on the account) in the
# production environment, and the repository secret CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: ["main", "sandbox"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'sandbox' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: HTML is valid
        run: npx --yes html-validate@11.17.0 "public/**/*.html"
      - name: Internal links resolve
        run: node scripts/check-links.mjs
      # A missing token fails the run: skipping quietly would report a deploy
      # that never happened, and tenwise.app would keep the old site.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README, Secrets). Nothing was deployed."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npx --yes wrangler@4.151.3 deploy
          else
            npx --yes wrangler@4.151.3 deploy --env sandbox
          fi
